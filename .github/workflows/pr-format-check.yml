name: PR 書式チェック

on:
  pull_request:
    types:
    - opened
    - edited
    - synchronize # コミットが追加されたとき
    - reopened
    - base_ref_changed # マージ先ブランチが変更されたとき

concurrency:
  group: pr-format-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # PR へのコメント投稿に必要
    steps:
      - name: 提出先ブランチのチェック
        id: branch
        continue-on-error: true
        # $ {{ }} 式を run: 内のシェルに直接展開すると、値に " などの特殊文字が含まれる場合に
        # シェルのクォートが崩れるため、env: 経由で環境変数として渡す。
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_BASE_REF: ${{ github.base_ref }}
        # ---------------------------------------------------------------
        # 提出先ブランチのチェック
        #
        # マージ先 (BASE) が submit/カリキュラム開始年月日/名イニシャル_姓/parent の形式かを検証する。
        #
        # HEAD が submit/{参加日}/{氏名}/{単元名} の形式であれば、
        # そこから正確な提出先を導出してエラーメッセージに含める。
        # HEAD がこの形式でない場合は汎用メッセージにフォールバックする。
        #
        # エラー時はコメント投稿用の Markdown を /tmp/branch_error.md に書き出して exit 1 する。
        # continue-on-error: true により、このステップが失敗しても
        # 後続のステップ（タイトルチェック・コメント投稿）は継続して実行される。
        # ---------------------------------------------------------------
        run: |
          HEAD="$GH_HEAD_REF"
          BASE="$GH_BASE_REF"

          if ! echo "$BASE" | grep -qE '^submit/[0-9]{8}/[^/]+/parent$'; then

            if echo "$HEAD" | grep -qE '^submit/[0-9]{8}/[^/]+/[^/]+$'; then
              PREFIX=$(echo "$HEAD" | sed 's|/[^/]*$||')
              EXPECTED_BASE="${PREFIX}/parent"
              cat > /tmp/branch_error.md << EOF
          ### ❌ プルリクエストの提出先が間違っています

          | | ブランチ |
          |---|---|
          | 現在の提出先 | \`$BASE\` |
          | 正しい提出先 | \`$EXPECTED_BASE\` |

          **💡 修正方法:** プルリクエストのタイトル右の Edit ボタン (✏️) をクリックして \`$EXPECTED_BASE\` に変更してください
          EOF
            else
              cat > /tmp/branch_error.md << EOF
          ### ❌ プルリクエストの提出先が間違っています

          | | ブランチ |
          |---|---|
          | 現在の提出先 | \`$BASE\` |
          | 正しい提出先の形式 | \`submit/カリキュラム開始年月日/名イニシャル_姓/parent\` |

          **💡 修正方法:** プルリクエストのタイトル右の Edit ボタン (✏️) をクリックして \`submit/カリキュラム開始年月日/名イニシャル_姓/parent\` のブランチ名を探して変更してください
          EOF
            fi
            exit 1
          fi

      - name: PR タイトルのチェック
        id: title
        continue-on-error: true
        # $ {{ }} 式を run: 内のシェルに直接展開すると、値に " などの特殊文字が含まれる場合に
        # シェルのクォートが崩れるため、env: 経由で環境変数として渡す。
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # ---------------------------------------------------------------
        # PR タイトルのチェック
        #
        # タイトルが規定の形式 [{単元名}]{氏名} になっているかを正規表現で検証する。
        #   - 単元名は HTML / CSS / JavaScript / MySQL / PHP / Laravel のいずれか
        #     (大文字小文字を問わない)
        #   - Laravel のみ、後ろに連番 (1–3) を付ける。
        #     連番の形式は (1) / 1 / ① のいずれでもよく、前に空白を挟んでもよい。
        #   - 単元名の後ろに氏名が1文字以上続くこと
        #
        # 全角文字・全角括弧など形式に合わない入力はこの1つのチェックで検出する。
        #
        # エラー時はコメント投稿用の Markdown を /tmp/title_error.md に書き出して exit 1 する。
        # continue-on-error: true により、このステップが失敗しても
        # 後続のステップ（コメント投稿）は継続して実行される。
        # ---------------------------------------------------------------
        run: |
          TITLE="$PR_TITLE"

          # タイトル形式チェック: [{単元名}]{氏名} または [{単元名}] {氏名}（閉じ括弧後の空白許容）
          # Laravel の連番: (1)(2)(3) / 1 2 3 / ① ② ③（スペースあり・なし両方許容）
          UNIT_PAT='(?i)^\[(HTML|CSS|JavaScript|MySQL|PHP|Laravel ?(\([1-3]\)|[1-3]|[①②③]))\] ?.+'
          if ! echo "$TITLE" | grep -qP "$UNIT_PAT"; then
            cat > /tmp/title_error.md << EOF
          ### ❌ プルリクエストのタイトルの形式が正しくありません

          **現在のタイトル:** $TITLE

          **正しい形式:** \`[{単元名}]{氏名}\`
          括弧・単元名は半角文字で入力してください。

          使える単元名: \`HTML\` / \`CSS\` / \`JavaScript\` / \`MySQL\` / \`PHP\` / \`Laravel\`
          ※ Laravel は番号も付けてください: \`[Laravel 1]\` \`[Laravel (1)]\` \`[Laravel ①]\`

          **例）** \`[HTML]山田太郎\`  \`[CSS] 鈴木花子\`  \`[Laravel 1]田中一郎\`

          **💡 修正方法:** プルリクエストのタイトル右の Edit ボタン (✏️) をクリックして変更してください
          EOF
            exit 1
          fi

      - name: エラーメッセージを組み立てる
        if: always()
        id: build-message
        # ---------------------------------------------------------------
        # エラーメッセージを組み立てる
        #
        # 前のステップが書き出したエラーファイルを読み込み、
        # sticky-pull-request-comment に渡すメッセージファイルを生成する。
        # エラーファイルが存在しない場合は has_error=false を出力して終了する。
        # ---------------------------------------------------------------
        run: |
          FIRST=true
          for file in /tmp/branch_error.md /tmp/title_error.md; do
            [ -f "$file" ] || continue
            if [ "$FIRST" != "true" ]; then
              printf '\n\n---\n\n' >> /tmp/sections.txt
            fi
            cat "$file" >> /tmp/sections.txt
            FIRST=false
          done

          if [ ! -f /tmp/sections.txt ]; then
            echo "has_error=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## ⚠️ プルリクエストチェックでエラーが見つかりました"
            echo ""
            cat /tmp/sections.txt
            echo ""
            echo "---"
            echo "*修正後は自動的に再チェックされます。*"
          } > /tmp/comment.md

          echo "has_error=true" >> "$GITHUB_OUTPUT"

      - name: エラーを PR にコメント投稿
        if: steps.build-message.outputs.has_error == 'true'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987  # v3
        with:
          header: pr-format-check
          path: /tmp/comment.md

      - name: チェック通過のためコメントを削除
        if: steps.build-message.outputs.has_error == 'false'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987  # v3
        with:
          header: pr-format-check
          delete: true

      - name: チェック結果の最終判定
        if: always()
        env:
          HAS_ERROR: ${{ steps.build-message.outputs.has_error }}
        run: |
          if [ "$HAS_ERROR" = "true" ]; then
            echo "❌ エラーがあります。プルリクエストのコメントを確認してください。"
            exit 1
          fi

          echo "✅ 全てのチェックに通過しました"
