<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>HTMLをCSSで装飾してみよう！</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="work_css.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="gray">
        <h2 id="headline">tableを装飾してみよう</h2>
        <table>
            <tr>
                <th>名前</th>
                <th>年齢</th>
                <th>出身</th>
            </tr>
            <tr>
                <td>田中</td>
                <td>20</td>
                <td>東京</td>
            </tr>
            <tr>
                <td>山田</td>
                <td>30</td>
                <td>大阪</td>
            </tr>
        </table>
        </div>
        <br>
        <h2>imgを装飾してみよう</h2>
        <div class="centering">
        <p>画像が表示されない場合の<span class="color_red">alt</span>も設定してください。</p>
        <img class="img_sourcecode" src="https://work.code-strategy.app/img/code.jpg" alt="ソースコード">
        </div>
        <br>
        <div class="gray">
        <h2>ulを装飾してみよう</h2>
        <p>li要素にカーソルを合わせると色が変わるように実装しましょう。</p>
        <ul class="color_ul">
            <li>
                <span class="color_li">HTML</span>
            </li>
            <li>
                <span class="color_li">CSS</span>
            </li>
            <li>
                <span class="color_li">Javascript</span>
            </li>
        </ul>
        <br>
        </div>
        <h2>要素を配置してみよう</h2>
        <div class="darkgray">
            <div class="positioning_block">
            <p class="positioning_t">各要素のpxは自由に指定してください。</p>
            <p class="positioning_t">一番大きいdivの横幅と円の直径は10:1です。</p>
            </div>
            <div class="circle_ltop"></div>
            <div class="rhombus_ltop"></div>
            <div class="circle_rtop"></div>
            <div class="rhombus_rtop"></div>
            <div class="circle_lbottom"></div>
            <div class="rhombus_lbottom"></div>
            <div class="circle_rbottom"></div>
            <div class="rhombus_rbottom"></div>
        </div>
        <br>
        <p>他に使ってみたいCSSがあったらこの下で書いてみてください！</p>
        <div class="container">
            <div class="item">Item1</div>
            <div class="item">Item2</div>
            <div class="item">Item3</div>
            <div class="item">Item4</div>
        </div>
    </body>
</html>
